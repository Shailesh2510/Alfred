name: Run Tests
on:
  pull_request:
    branches: [main, dev]

jobs:
  test-guest-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install Node Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test

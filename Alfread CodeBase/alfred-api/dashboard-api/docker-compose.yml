version: '3.8'
services:
  db:
    container_name: aomsdb
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=aomsdb
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes: 
      - db:/var/lib/postgresql/data
      # - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server
    volumes:
      - redis:/data
  api:
    build: .
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis

volumes:
  db:
    driver: local
  redis:
    driver: local